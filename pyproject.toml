[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysecretsweep"
version = "1.0.0"
description = "Zero-dependency secret and PII scanning for source trees, stdin, and git diffs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysecretsweep contributors" }]
keywords = ["secrets", "pii", "security", "scanner", "sarif", "git-diff"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
pysecretsweep = "pysecretsweep.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pysecretsweep"
Repository = "https://github.com/draarivpatel-ui/pysecretsweep"
Issues = "https://github.com/draarivpatel-ui/pysecretsweep/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysecretsweep = ["py.typed"]
